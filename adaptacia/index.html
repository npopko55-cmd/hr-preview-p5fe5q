<script>
(function(){
  // защита от двойного нажатия «Отправить»; при возврате кнопкой «Назад» кнопка снова активна
  var f = document.getElementById('f'), b = document.getElementById('send');
  if (!f || !b) return;
  f.addEventListener('submit', function(){ b.disabled = true; });
  window.addEventListener('pageshow', function(){ b.disabled = false; });
})();
</script>
